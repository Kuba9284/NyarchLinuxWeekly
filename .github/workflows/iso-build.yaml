
name: Build Nyarch ISO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: nyarch-iso-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux/archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Get latest official Nyarch version
        id: official
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "NyarchLinux",
              repo: "NyarchLinux"
            });

            const version = release.tag_name.replace(/^v/, "");

            if (!/^\d{2}\.\d{2}$/.test(version)) {
              throw new Error(
                `Unexpected official version tag: ${release.tag_name}`
              );
            }

            core.setOutput("version", version);
            core.info(`Official Nyarch version: ${version}`);

      - run: pwd
      - run: find .
      - run: cat /etc/os-release
      - run: pacman-key --init
      - run: pacman --noconfirm -Sy archlinux-keyring grub
      - run: bash Gnome/install_chaotic.sh
      - run: cd Gnome && bash steps.sh

      - name: Verify ISO exists
        id: iso
        shell: bash
        run: |
          ISO="$(find "$GITHUB_WORKSPACE/Gnome/out" \
            -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [[ -z "$ISO" ]]; then
            echo "No ISO found in Gnome/out"
            exit 1
          fi

          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Upload original ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyarch-ISO-original
          path: ${{ steps.iso.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Calculate next release number
        id: version
        uses: actions/github-script@v7
        env:
          BASE_VERSION: ${{ steps.official.outputs.version }}
        with:
          script: |
            const base = process.env.BASE_VERSION;
            const { owner, repo } = context.repo;

            const { data: releases } =
              await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 100
              });

            let highest = 0;
            const pattern = new RegExp(
              "^" + base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
              "\\.(\\d+)$"
            );

            for (const release of releases) {
              const match = release.tag_name.match(pattern);
              if (match) {
                highest = Math.max(highest, Number(match[1]));
              }
            }

            const tag = `${base}.${highest + 1}`;

            core.setOutput("tag", tag);
            core.info(`Creating release ${tag}`);

      - name: Split ISO for GitHub Releases
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ISO_PATH: ${{ steps.iso.outputs.path }}
        run: |
          split -b 1900M "$ISO_PATH" \
            "$GITHUB_WORKSPACE/Gnome/out/${TAG}-iso.part-"

          ls -lh "$GITHUB_WORKSPACE/Gnome/out/${TAG}-iso.part-"*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nyarch Linux ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Automated Nyarch Linux ISO build.

            Official Nyarch version: ${{ steps.official.outputs.version }}
            Build: ${{ steps.version.outputs.tag }}

            ## Downloading the ISO

            Download every asset ending in .part-aa, .part-ab, etc.
            Place all parts in the same directory, then run:

                cat ${{ steps.version.outputs.tag }}-iso.part-* > Nyarch-Linux-${{ steps.version.outputs.tag }}.iso

            This reconstructs the original ISO. Verify its checksum
            before using it if a checksum is provided.
          files: Gnome/out/${{ steps.version.outputs.tag }}-iso.part-*
